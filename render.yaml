# Render Blueprint — https://render.com/docs/blueprint-spec
#
# With this file in the repo root you can use New > Blueprint on Render and it
# configures the service itself, instead of you filling the form in by hand.
#
# Only the API is deployed here. The website (index.html / style.css /
# script.js) is static and belongs on GitHub Pages — Render would just be a
# more expensive way to serve three files.

services:
  - type: web
    name: video-hub-api
    runtime: docker
    plan: free

    # Build from server/, not the repo root. dockerfilePath is resolved
    # relative to rootDir.
    rootDir: server
    dockerfilePath: ./Dockerfile

    healthCheckPath: /api/health

    envVars:
      # Set this to your GitHub Pages origin once you know it, e.g.
      #   https://<your-username>.github.io
      # Comma-separate for more than one. Leaving it unset allows any origin,
      # which means anyone can point their own site at your server and spend
      # your bandwidth — and on the free plan that is only 5 GB/month.
      # sync: false makes Render prompt for it at deploy instead of baking a
      # value into the repo.
      - key: ALLOWED_ORIGINS
        sync: false

      # Cookies do NOT go here — they come from a Secret File.
      #
      # Without a logged-in session most links fail on Render even though they
      # work from a laptop: these are datacenter IPs, and the platforms serve
      # those a bot check rather than the video. YouTube's shows up as "That
      # video is private or needs a login" on a video that is plainly public.
      # Instagram serves no photo media to logged-out clients at all.
      #
      # Blueprints can't declare Secret Files, so this part is manual and only
      # needs doing once:
      #
      #   Dashboard -> this service -> Environment -> Secret Files -> Add
      #   Filename: cookies.txt
      #   Contents: a Netscape cookies.txt exported from a logged-in browser
      #
      # Render mounts it read-only at /etc/secrets/cookies.txt, which server.js
      # already looks for. Nothing touches the repo — which matters, because a
      # cookies.txt is a password that skips 2FA and this repo is public.
      #
      # Only youtube/tiktok/instagram/facebook entries are loaded; the server
      # drops everything else in the export before using it. Even so, use a
      # burner account: these requests come from a datacenter IP, which every
      # platform reads as automation, and accounts can be banned for it.
      # Sessions expire after a few weeks, at which point downloads start
      # failing with the login message until you replace the Secret File.
      #
      # YTDLP_COOKIES / IG_COOKIES still work as an env-var fallback, but a
      # full jar is far past what an env var should hold.
