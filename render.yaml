# Render Blueprint — https://render.com/docs/blueprint-spec
#
# With this file in the repo root you can use New > Blueprint on Render and it
# configures the service itself, instead of you filling the form in by hand.
#
# Only the API is deployed here. The website (index.html / style.css /
# script.js) is static and belongs on GitHub Pages — Render would just be a
# more expensive way to serve three files.

services:
  - type: web
    name: video-hub-api
    runtime: docker
    plan: free

    # Build from server/, not the repo root. dockerfilePath is resolved
    # relative to rootDir.
    rootDir: server
    dockerfilePath: ./Dockerfile

    healthCheckPath: /api/health

    envVars:
      # Set this to your GitHub Pages origin once you know it, e.g.
      #   https://<your-username>.github.io
      # Comma-separate for more than one. Leaving it unset allows any origin,
      # which means anyone can point their own site at your server and spend
      # your bandwidth — and on the free plan that is only 5 GB/month.
      # sync: false makes Render prompt for it at deploy instead of baking a
      # value into the repo.
      - key: ALLOWED_ORIGINS
        sync: false

      # Netscape cookies.txt from a logged-in session, pasted whole. Escaped \n
      # are accepted, since Render's field is single-line.
      #
      # This one covers video, on every platform, and without it most links
      # fail here even though they work from a laptop: Render's IPs are
      # datacenter IPs, and the platforms serve those a bot check rather than
      # the video. YouTube's shows up as "That video is private or needs a
      # login" on a video that is plainly public.
      #
      # A jar is domain-scoped, so one export can carry YouTube, Instagram and
      # Facebook at once — each site is only ever offered its own entries.
      - key: YTDLP_COOKIES
        sync: false

      # The same thing under its older, Instagram-specific name. Kept because
      # deployed services already set it; both are merged into one jar.
      #
      # Instagram serves no photo media to logged-out clients at all, so the
      # photo route needs a session even from a residential IP.
      #
      # Use burner accounts. These run from a datacenter IP, which every
      # platform reads as automation, and accounts can be banned for it.
      # Sessions also expire after a few weeks, at which point downloads start
      # failing with the login message until you paste a fresh export.
      - key: IG_COOKIES
        sync: false
